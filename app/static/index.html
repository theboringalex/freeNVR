<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>freeNVR</title>
  <link rel="stylesheet" href="/css/app.css">
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.7/dist/hls.min.js"></script>
</head>
<body>
  <nav class="navbar">
    <div class="navbar-brand">
      <span class="icon">&#9724;</span> freeNVR
    </div>
    <div class="navbar-menu">
      <button class="nav-btn active" data-view="live">Live</button>
      <button class="nav-btn" data-view="recordings">Aufnahmen</button>
      <button class="nav-btn" data-view="events">Ereignisse</button>
      <button class="nav-btn" data-view="cameras">Kameras</button>
    </div>
    <div class="navbar-right">
      <span id="ai-badge" class="ai-badge"></span>
      <span id="storage-info" class="storage-badge"></span>
    </div>
  </nav>

  <main id="app">
    <!-- Live View -->
    <div id="view-live" class="view active">
      <div id="camera-grid" class="camera-grid"></div>
    </div>

    <!-- Recordings -->
    <div id="view-recordings" class="view">
      <div class="toolbar">
        <select id="rec-camera-filter"><option value="">Alle Kameras</option></select>
        <input type="date" id="rec-date-filter">
        <button class="btn" onclick="loadRecordings()">Laden</button>
      </div>
      <div id="recordings-list" class="list-container"></div>
    </div>

    <!-- Events -->
    <div id="view-events" class="view">
      <div class="toolbar">
        <select id="evt-camera-filter"><option value="">Alle Kameras</option></select>
        <select id="evt-type-filter">
          <option value="">Alle Typen</option>
          <option value="motion">Bewegung</option>
          <option value="person">Person</option>
          <option value="car">Auto</option>
        </select>
        <button class="btn" onclick="loadEvents()">Laden</button>
      </div>
      <div id="events-list" class="list-container"></div>
    </div>

    <!-- Camera Management -->
    <div id="view-cameras" class="view">
      <div class="toolbar">
        <button class="btn btn-primary" onclick="showAddCamera()">+ Kamera hinzufügen</button>
        <button class="btn btn-onvif" onclick="showOnvifImport()">&#128246; ONVIF Import</button>
        <button class="btn" onclick="discoverOnvif()">&#128269; Netzwerk-Scan</button>
      </div>
      <div id="cameras-list" class="list-container"></div>
    </div>
  </main>

  <!-- Add/Edit Camera Modal -->
  <div id="modal" class="modal hidden">
    <div class="modal-box">
      <h2 id="modal-title">Kamera hinzufügen</h2>
      <form id="camera-form">
        <input type="hidden" id="cam-id">
        <div class="form-section">
          <div class="form-section-title">Verbindung</div>
          <label>Name <input type="text" id="cam-name" required></label>
          <label>RTSP URL <input type="text" id="cam-rtsp" placeholder="rtsp://192.168.1.x/stream" required></label>
          <label>Substream URL <input type="text" id="cam-sub" placeholder="rtsp://... (optional)"></label>
          <label>Benutzername <input type="text" id="cam-user"></label>
          <label>Passwort <input type="password" id="cam-pass"></label>
        </div>
        <div class="form-section">
          <div class="form-section-title">Aufnahme &amp; Erkennung</div>
          <label>Aufnahme
            <select id="cam-mode">
              <option value="continuous">Kontinuierlich (24/7)</option>
              <option value="motion">Nur bei Ereignis</option>
              <option value="disabled">Deaktiviert</option>
            </select>
          </label>
          <label>Erkennung
            <select id="cam-detection">
              <option value="ffmpeg">FFmpeg (Szenenänderung)</option>
              <option value="coral">Coral TPU / TFLite (KI)</option>
              <option value="none">Keine</option>
            </select>
          </label>
        </div>
        <div class="form-section">
          <div class="form-section-title">ONVIF (optional)</div>
          <label>ONVIF Host <input type="text" id="cam-onvif-host" placeholder="IP-Adresse (leer = wie RTSP)"></label>
          <label>ONVIF Port <input type="number" id="cam-onvif-port" value="8000"></label>
          <label class="checkbox-label">
            <input type="checkbox" id="cam-onvif-events"> ONVIF Ereignisse aktivieren
          </label>
        </div>
        <label class="checkbox-label">
          <input type="checkbox" id="cam-enabled" checked> Aktiviert
        </label>
        <div class="form-actions">
          <button type="button" class="btn" onclick="closeModal()">Abbrechen</button>
          <button type="submit" class="btn btn-primary">Speichern</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ONVIF Import Modal -->
  <div id="modal-onvif" class="modal hidden">
    <div class="modal-box">
      <h2>ONVIF Kamera importieren</h2>
      <form id="onvif-form">
        <label>ONVIF Host / IP <input type="text" id="onvif-host" required placeholder="192.168.1.100"></label>
        <label>ONVIF Port <input type="number" id="onvif-port" value="8000"></label>
        <label>Benutzername <input type="text" id="onvif-user" required></label>
        <label>Passwort <input type="password" id="onvif-pass" required></label>
        <label>Kameraname <input type="text" id="onvif-name" placeholder="Wird auto. aus Gerätedaten ermittelt"></label>
        <label>Aufnahme
          <select id="onvif-mode">
            <option value="continuous">Kontinuierlich</option>
            <option value="motion">Nur bei Ereignis</option>
          </select>
        </label>
        <label class="checkbox-label">
          <input type="checkbox" id="onvif-events" checked> ONVIF Ereignisse aktivieren
        </label>
        <div id="onvif-probe-result" class="probe-result hidden"></div>
        <div class="form-actions">
          <button type="button" class="btn" onclick="closeOnvifModal()">Abbrechen</button>
          <button type="button" class="btn" onclick="probeOnvif()">&#128269; Verbindung testen</button>
          <button type="submit" class="btn btn-primary">Importieren</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Discovery Modal -->
  <div id="modal-discover" class="modal hidden">
    <div class="modal-box" style="max-width:600px">
      <h2>ONVIF Kameras im Netzwerk</h2>
      <div id="discover-list" class="list-container" style="max-height:400px;overflow:auto">
        <p style="color:var(--text-muted)">Suche läuft...</p>
      </div>
      <div class="form-actions">
        <button class="btn" onclick="closeDiscoverModal()">Schließen</button>
      </div>
    </div>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
